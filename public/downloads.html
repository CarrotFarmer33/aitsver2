<script>
(function(){'use strict';
var all=JSON.parse(document.getElementById('dl-data').textContent).downloads;
var ORDER=['Physics','Chemistry','Mathematics'];
var subjects=[];all.forEach(function(d){var s=d.subject||'Other';if(subjects.indexOf(s)<0)subjects.push(s);});
subjects.sort(function(a,b){var i=ORDER.indexOf(a),j=ORDER.indexOf(b);return (i<0?99:i)-(j<0?99:j);});
var tabs=document.getElementById('tabs'),list=document.getElementById('list'),count=document.getElementById('count'),sub=document.getElementById('sub'),search=document.getElementById('search'),sort=document.getElementById('sort'),empty=document.getElementById('empty'),panel=document.getElementById('panel');
var current=subjects[0];
var fromHash=location.hash.slice(1).toLowerCase();
subjects.forEach(function(s){if(s.toLowerCase()===fromHash)current=s;});
function pad(n){return n<10?'0'+n:String(n);}
function items(s){return all.filter(function(d){return (d.subject||'Other')===s;});}
function buildTabs(){
  tabs.textContent='';
  subjects.forEach(function(s){
    var b=document.createElement('button');b.type='button';b.className='tab';b.setAttribute('role','tab');b.id='tab-'+s.toLowerCase();
    b.setAttribute('aria-selected',s===current?'true':'false');b.tabIndex=s===current?0:-1;
    b.appendChild(document.createTextNode(s));
    var n=document.createElement('span');n.className='n';n.textContent=items(s).length;b.appendChild(n);
    b.addEventListener('click',function(){select(s);});
    b.addEventListener('keydown',function(e){
      var i=subjects.indexOf(current),k=e.key;
      if(k==='ArrowRight')i=(i+1)%subjects.length;else if(k==='ArrowLeft')i=(i-1+subjects.length)%subjects.length;else return;
      e.preventDefault();select(subjects[i]);document.getElementById('tab-'+subjects[i].toLowerCase()).focus();
    });
    tabs.appendChild(b);
  });
}
function select(s){
  current=s;
  try{history.replaceState(null,'','#'+s.toLowerCase());}catch(e){}
  buildTabs();render();
}
function row(d){
  var tr=document.createElement('tr');
  var n=document.createElement('td');n.className='n';n.textContent=pad(d.number);
  var t=document.createElement('td');t.textContent=d.title;
  var a=document.createElement('td');a.className='act';
  var b=document.createElement('a');b.className='btn sm dl';
  if(d.url){b.className+=' primary';b.href=d.url;b.target='_blank';b.rel='noopener noreferrer';b.textContent='Download PDF';}
  else{b.setAttribute('aria-disabled','true');b.textContent='Coming soon';}
  a.appendChild(b);tr.appendChild(n);tr.appendChild(t);tr.appendChild(a);return tr;
}
function render(){
  var term=search.value.trim().toLowerCase();
  var shown=items(current).filter(function(d){return (pad(d.number)+' '+d.title).toLowerCase().indexOf(term)!==-1;});
  shown.sort(function(a,b){return sort.value==='alpha'?a.title.localeCompare(b.title):a.number-b.number;});
  list.textContent='';
  panel.setAttribute('aria-labelledby','tab-'+current.toLowerCase());
  shown.forEach(function(d){list.appendChild(row(d));});
  var total=items(current).length;
  count.textContent=shown.length+' PDF'+(shown.length===1?'':'s')+(term?' of '+total:'');
  sub.textContent='Chapter-wise '+current+' PDFs, in chapter order.';
  empty.hidden=shown.length>0;
}
search.addEventListener('input',render);sort.addEventListener('change',render);
buildTabs();render();
})();
